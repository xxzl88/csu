---
layout: default
---
<article class="article-page">
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time>{% if page.categories.first %}<span class="dot">·</span><span>{{ page.categories | join: ' / ' }}</span>{% endif %}</div>
  </header>
  <div class="article-layout">
    <div class="article-body">{{ content }}</div>
    <!--
    <aside class="article-aside">
      <a href="{{ '/' | relative_url }}">返回</a>
    </aside>
    -->
  </div>
</article>
