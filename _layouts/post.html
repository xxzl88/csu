---
layout: default
---
<article class="article-page">
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">时间：{{ page.date | date: "%Y年%m月%d日" }}</time>{% if page.categories.first %}<span>类别：{{ page.categories | join: ' / ' }}</span>{% endif %}</div>
  </header>
  <div class="article-layout">
    <div class="article-body">{{ content }}</div>
    <section class="article-qrcode" aria-label="本文二维码">
      <p>扫码在手机上查看本文</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&amp;format=svg&amp;ecc=M&amp;data={{ page.url | absolute_url | url_encode }}" width="180" height="180" alt="《{{ page.title }}》二维码">
    </section>
  </div>
</article>
