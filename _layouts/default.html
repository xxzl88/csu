<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="{{ '/assets/images/touxiang.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script>window.BLOG_BASEURL = {{ site.baseurl | jsonify }};</script>
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="回到首页">
          <span>{{ site.title }}</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">菜单</button>
        <nav id="site-nav" class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/topics/' | relative_url }}">分类</a>
          <a href="{{ '/about/' | relative_url }}">关于网站</a>
          <a href="{{ '/search/' | relative_url }}">搜索</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div>
          <strong>联系方式</strong>
        </div>
        <div class="footer-links">
          {% if site.social.email %}<a href="{{ site.social.email }}">邮件</a>{% endif %}
            {% if site.social.qq %}<a href="{{ site.social.qq }}">QQ</a>{% endif %}
        </div>
      </div>
      <div class="container copyright">© 2023- {{ 'now' | date: '%Y' }} {{ site.title }}</div>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
