# 博客基本配置：部署前请修改 url、baseurl、title、author 和 social。
title: "我的分享小站 | xxzl88"
description: "分享课程资料，交流学习成果！"
url: "https://xxzl88.github.io"
baseurl: "/csu" # 用户站点填 ""；项目站点填 "/仓库名"
lang: "zh-CN"
timezone: "Asia/Shanghai"

author:
  name: "xxzl88"
  avatar: "/assets/images/avatar.svg"
  bio: "课程资料整理与学习交流"
  location: "中国"
  email: "xxzl88@qq.com"
  github: "xxzl88"

social:
  email: "mailto:xxzl88@qq.com"
  qq: "tencent://message/?uin=718123472"
  
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/
paginate: 6
paginate_path: "/page:num/"
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  style: compressed
